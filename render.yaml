# Render "Blueprint": describes the backend web service and its PostgreSQL database.
# Render reads this file when you create a Blueprint from the GitHub repository.
databases:
  - name: fraud-db
    databaseName: fraud_detection
    plan: free

services:
  - type: web
    name: fraud-api
    runtime: python
    rootDir: backend
    plan: free
    # Install libraries, collect the admin's static files, create/update the tables,
    # and (optionally) create the demo accounts.
    buildCommand: >-
      pip install -r requirements.txt
      && python manage.py collectstatic --no-input
      && python manage.py migrate --no-input
      && (test "$SEED_DEMO_USERS" != "true" || python manage.py seed_demo --users-only)
    healthCheckPath: /api/health/
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 60
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        fromDatabase:
          name: fraud-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: FRAUD_WARMUP
        value: "false"
      - key: SEED_DEMO_USERS
        value: "true"
      # You fill these in on Render's website (they are not stored in the repo):
      - key: DEMO_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
